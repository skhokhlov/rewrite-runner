name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit:
    name: Default checks
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Unit tests + lint + fat JAR
        run: ./gradlew check shadowJar

  integration:
    name: Integration tests (offline)
    runs-on: ubuntu-latest
    needs: unit

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Offline integration tests
        run: ./gradlew :cli:testIntegration

  windows-worker:
    name: Forked worker checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    needs: unit
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Forked worker tests (Windows)
        if: runner.os == 'Windows'
        run: .\gradlew.bat --no-daemon :core:testWorker :cli:testWorker

      - name: Forked worker tests (Linux)
        if: runner.os != 'Windows'
        run: ./gradlew --no-daemon :core:testWorker :cli:testWorker

      - name: Upload worker diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: worker-diagnostics-${{ runner.os }}
          path: |
            core/build/reports/tests/testWorker
            core/build/test-results/testWorker
            cli/build/reports/tests/testWorker
            cli/build/test-results/testWorker
          if-no-files-found: warn
          retention-days: 14

  plugin-real:
    name: Integration tests (real plugins)
    runs-on: ubuntu-latest
    needs: [integration, windows-worker]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Cache Maven local repository
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: maven-${{ runner.os }}-

      - name: Cache test toolchains (Maven/Gradle distributions)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4
        with:
          # The Gradle distribution version baked into this cache is determined by the project's
          # own gradle-wrapper.properties. The hashFiles entry below ensures bumping the wrapper
          # automatically evicts a stale cached distribution.
          path: cli/build/test-cache/toolchains
          key: toolchains-${{ runner.os }}-v4-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: toolchains-${{ runner.os }}-v4-

      - name: Real-plugin integration tests
        run: ./gradlew :cli:testRealPlugin --info
        timeout-minutes: 25

      - name: Upload real-plugin diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-plugin-diagnostics
          path: |
            cli/build/reports/tests/testRealPlugin
            cli/build/test-results/testRealPlugin
          if-no-files-found: warn
          retention-days: 14

  container:
    name: Container acceptance (2 GiB cgroup)
    runs-on: ubuntu-latest
    needs: plugin-real

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Container acceptance
        run: ./gradlew :cli:testContainer --info
        timeout-minutes: 15

      - name: Upload container diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: container-diagnostics
          path: |
            cli/build/reports/tests/testContainer
            cli/build/test-results/testContainer
          if-no-files-found: warn
          retention-days: 14
